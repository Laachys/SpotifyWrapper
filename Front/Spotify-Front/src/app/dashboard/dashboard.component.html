<div class="container">
  <div class="dashboard-container">

    <div class="row">

      <div *ngIf="isLoading" class="loading-state">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Cargando datos de Spotify...</p>
      </div>
      
    </div>

    <div *ngIf="!isLoading" class="dashboard-content">

      <div class="dashboard-card">
        <h3 class="dashboard-title">Top Artistas más escuchados:</h3>
        <app-top-artists [topArtistsChartData]="topArtistsChartData" [topArtistsList]="topArtists"></app-top-artists>
      </div>

      <div class="dashboard-card chart-card">
        <h3 class="dashboard-title">Géneros más escuchados:</h3>
        <app-genre-chart [genreData]="genreData"></app-genre-chart>
      </div>
      <div class="dashboard-card chart-card">
        <h3 class="dashboard-title">Canciones más escuchadas este año:</h3>
        <app-top-tracks [tracks]="topTracks"></app-top-tracks>
      </div>

      <div class="dashboard-card chart-card">
        <h3 class="dashboard-title">Actividad Reciente: </h3>
        <app-recent-activity [recentPlaysData]="recentPlays"></app-recent-activity>
      </div>
    </div>
  </div>
</div>
