<div class="profile-card">
  <div class="profile-header">
    <img [src]="user?.images[0]?.url || 'assets/default-profile.png'" 
         alt="Profile" class="profile-image">
    <h2>{{user?.display_name}}</h2>

    
    
  </div>
  
  <div class="profile-details">
    <span class="title-details">Información:</span>
    <div class="detail-item">
      <span class="label">Numero total de seguidores: </span>
      <span class="followers">{{user?.followers?.total}}</span>
    </div>
    <div class="detail-item">
      <span class="label">País: </span>
      <span class="value">{{user?.country || 'No especificado'}}</span>
    </div>
    <div class="detail-item">
      <span class="label">Tipo de cuenta: </span>
      <span class="value">{{user?.product || 'Free'}}</span>
    </div>
  </div>
</div>
